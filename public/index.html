<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' },
            dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
          },
        },
      },
    };
  </script>
  <style>
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); }
    .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body class="bg-dark-900 text-white min-h-screen flex flex-col">
  <header class="border-b border-dark-700 bg-dark-800/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <h1 class="text-xl font-bold text-white">Free AI Tracker</h1>
        </div>
        <div class="flex items-center gap-4">
          <span id="lastUpdated" class="text-sm text-dark-400 hidden sm:block">Loading...</span>
          <img id="profilePhoto" src="/profile.jpg" alt="Dr Raouf Roshdy" class="w-10 h-10 rounded-full object-cover border-2 border-primary-500/50 hidden md:block" onerror="this.style.display='none'">
          <button id="refreshBtn" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg transition-colors">
            Refresh
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="mb-8">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-dark-800 rounded-xl p-6 border border-dark-700">
          <p class="text-dark-400 text-sm font-medium">Total Scanned</p>
          <p id="statTotal" class="text-3xl font-bold text-white mt-1">—</p>
        </div>
        <div class="bg-dark-800 rounded-xl p-6 border border-dark-700">
          <p class="text-dark-400 text-sm font-medium">Relevant Offers</p>
          <p id="statRelevant" class="text-3xl font-bold text-primary-500 mt-1">—</p>
        </div>
        <div class="bg-dark-800 rounded-xl p-6 border border-dark-700">
          <p class="text-dark-400 text-sm font-medium">Last Updated</p>
          <p id="statTimestamp" class="text-3xl font-bold text-white mt-1">—</p>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold">Latest AI Offers</h2>
      <div class="flex gap-2 flex-wrap">
        <button id="filterAll" class="filter-btn active px-3 py-1 text-sm rounded-lg bg-primary-600 text-white">All</button>
        <button id="filterFree" class="filter-btn px-3 py-1 text-sm rounded-lg bg-dark-700 text-dark-300 hover:bg-dark-600">Free Models</button>
        <button id="filterGithub" class="filter-btn px-3 py-1 text-sm rounded-lg bg-dark-700 text-dark-300 hover:bg-dark-600">GitHub Releases</button>
        <button id="filterPlatform" class="filter-btn px-3 py-1 text-sm rounded-lg bg-dark-700 text-dark-300 hover:bg-dark-600">Platform Updates</button>
      </div>
    </div>

    <div id="offersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>

    <div id="emptyState" class="hidden text-center py-16">
      <svg class="w-16 h-16 mx-auto text-dark-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <p class="text-dark-400 text-lg">No offers found</p>
      <p class="text-dark-500 mt-1">Run the cron job or check back later</p>
    </div>
  </main>

  <footer class="border-t border-dark-700 bg-dark-800/50 py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-dark-400 text-sm">
        <span>Created by Dr Raouf Roshdy</span>
        <span>Vol. 1.0</span>
      </div>
    </div>
  </footer>

  <script>
    let allOffers = [];
    let currentFilter = 'all';

    const API_URL = '/api/get-offers';

    async function fetchOffers() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.success) {
          allOffers = data.findings || [];
          updateStats(data);
          renderOffers();
        } else {
          showError(data.error || 'Failed to load offers');
        }
      } catch (err) {
        showError('Network error: ' + err.message);
      }
    }

    function updateStats(data) {
      document.getElementById('statTotal').textContent = data.totalFindings || 0;
      document.getElementById('statRelevant').textContent = data.relevantFindings || 0;
      document.getElementById('statTimestamp').textContent = formatDate(data.timestamp);
      document.getElementById('lastUpdated').textContent = `Updated ${formatRelativeTime(data.timestamp)}`;
    }

    function renderOffers() {
      const grid = document.getElementById('offersGrid');
      const emptyState = document.getElementById('emptyState');

      let filtered = allOffers;
      if (currentFilter === 'free') filtered = allOffers.filter(o => o.source === 'openrouter' || o.source === 'replicate');
      else if (currentFilter === 'github') filtered = allOffers.filter(o => o.source === 'github');
      else if (currentFilter === 'platform') filtered = allOffers.filter(o => ['huggingface', 'vercel', 'openai'].includes(o.source));

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = filtered.map(offer => createCard(offer)).join('');
    }

    function createCard(offer) {
      const sourceColors = {
        github: 'bg-purple-500/20 text-purple-400',
        huggingface: 'bg-yellow-500/20 text-yellow-400',
        vercel: 'bg-gray-500/20 text-gray-400',
        openai: 'bg-green-500/20 text-green-400',
        openrouter: 'bg-blue-500/20 text-blue-400',
        replicate: 'bg-orange-500/20 text-orange-400',
      };
      const sourceLabel = offer.source.charAt(0).toUpperCase() + offer.source.slice(1);
      const score = Math.round((offer.score || 0) * 100);

      return `
        <article class="card-hover bg-dark-800 rounded-xl p-6 border border-dark-700 h-full flex flex-col">
          <div class="flex items-start justify-between mb-3">
            <span class="px-2 py-1 text-xs font-medium rounded-full ${sourceColors[offer.source] || 'bg-dark-600 text-dark-300'}">
              ${sourceLabel}
            </span>
            <span class="text-xs text-dark-500">${formatDate(offer.publishedAt)}</span>
          </div>
          <h3 class="text-lg font-semibold text-white mb-2 line-clamp-2">${escapeHtml(offer.title)}</h3>
          <p class="text-dark-400 text-sm mb-4 flex-1 line-clamp-3">${escapeHtml(offer.body || 'No description available')}</p>
          <div class="flex items-center justify-between pt-4 border-t border-dark-700">
            <div class="flex items-center gap-2">
              <span class="text-xs text-dark-500">Score:</span>
              <div class="w-24 h-2 bg-dark-700 rounded-full overflow-hidden">
                <div class="h-full bg-primary-500" style="width: ${score}%"></div>
              </div>
              <span class="text-xs font-medium text-primary-500">${score}%</span>
            </div>
            <a href="${escapeHtml(offer.url)}" target="_blank" rel="noopener noreferrer"
               class="text-sm font-medium text-primary-500 hover:text-primary-400 transition-colors flex items-center gap-1">
              View Offer →
            </a>
          </div>
        </article>
      `;
    }

    function formatDate(iso) {
      if (!iso) return 'Unknown';
      const date = new Date(iso);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function formatRelativeTime(iso) {
      if (!iso) return 'Unknown';
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      if (hours < 24) return `${hours}h ago`;
      return `${days}d ago`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showError(msg) {
      document.getElementById('offersGrid').innerHTML = `
        <div class="col-span-full text-center py-16 bg-dark-800 rounded-xl border border-red-500/20">
          <svg class="w-12 h-12 mx-auto text-red-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <p class="text-red-400">${escapeHtml(msg)}</p>
        </div>
      `;
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'bg-primary-600', 'text-white'));
        btn.classList.add('active', 'bg-primary-600', 'text-white');
        btn.classList.remove('bg-dark-700', 'text-dark-300');
        currentFilter = btn.id.replace('filter', '').toLowerCase();
        if (currentFilter === 'all') currentFilter = 'all';
        renderOffers();
      });
    });

    document.getElementById('refreshBtn').addEventListener('click', fetchOffers);

    fetchOffers();
    setInterval(fetchOffers, 5 * 60 * 1000);
  </script>
</body>
</html>
